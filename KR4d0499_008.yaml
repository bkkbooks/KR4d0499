body:
  text: 檜亭集卷八元丁復撰近體七言律詩新寺和張仲舉兼次韻前集天宫兜率下崔嵬綺結交疏靣面開地勢周圍龍虎國鐘聲疏應鳯凰臺鼎湖仙去秋遺劔笠澤僧歸夜渡杯千騎巡街羣樂動五雲深處夜香來天壽節龍翔寺習儀次韻銛上人彤扉笳鼓羣公集烏府冠裳百辟儀金甲繞纒龍擁座綵章掀舞鳯交旗九天空闊蒼雲杳四海升平白日遲皓首南邦無變化何由一息向天池鴈門送楊仲𢎞姪士耕歸龍泉伯也未入玉堂日我亦忝薦金閨名三千里外嗟淪落二十年餘異死生猶子初從鴈門見故鄉能作龍泉行腸斷東門别小阮索詩相送若為情趙君澤母一百七歲南康校官致仕日北堂夫人長壽身一百歲後有七歲千萬人中無幾人王母娥眉曾不老諸孫鶴髮但重新桐川之水東到海海上桃花樹樹春送陳子英縣尹之崇仁江回彭蠡天與碧路入臨川山復蒼令尹先為武進縣絃歌况逢君子鄉黃禽雙啼白日靜緑草自動春風香巾車數問虞夫子未慙元亮在柴桑越州景德寺鏡清方丈題醉先宋僧名嶽麓園鏡清方丈見嶽麓堂虛咫尺行江潭樹木連雲崖影濕樓臺隔日水氣酣皇英雙騎龍上下蒼梧九點天東南道人得我千古意復遣老夢登嶇送唐長卿赴常州教授三茅斷作湖嶼碧常州升州猶比鄰山君化鶴去問客水鳥銜魚來獻人釀酒未嫌官舍冷開倉常恐士家貧絶嗟一概鳴琴地杏花閉門消却春送美上人歸臨川白雲不生華蓋峰青天淨倚碧芙蓉上船不計日多少到寺更行山幾重木客試人騎出虎淵靈求法脫為龍莫貪石室跏趺穩遍長松門薜荔封送黃民尚入京自甘白髮投南老相送黃郎賦北遊十月肅霜清廣道五雲佳日照高樓儒生合在賢能舉宰相方深吐握求明日風帆如疾馬有時煙渚惜眠鷗題觀海圖為張晉賢作自古十洲三島勝幾時一釣六鼇連千年王母蟠桃實五百童兒採藥船日出早看金柱湧天空只擬玉壺縣乘槎欲接張公子直到牽牛織女邊贈張晉賢侍夏真人慶吳大宗師七十玉皇香案仙臣老金母瑶池鳥使來五色雲霞宫裏錦九天沆瀣掌中杯朝廷禮數恩波洽海宇歡榮壽域開張果子孫商嶺皓此時相與醉蓬萊題方壺子天台圖送曹士安省親還上清仙人飈車竟獨往我家天台不得還六十江上老為客半夜夢中無數山雲飛舍下兩白髮桃熟溪頭雙緑鬟更煩爾祖方壺子寫我與君劉阮間次韻銛上人龍河月夜謾興二首臺殿總依丹鳯闕江山或擬白龍堆潛籓地重雄南服執法星明近上台天際飛塵君使到日頭出處客僧來翻經夜月旃檀室滿座香風薝蔔開秦淮水流落日西瑶階不受翠煙迷絶憐明月真堪摘却是青天不可梯電掣海光龍出弄雪翻林影鶴驚栖榑桑若木同根葉莫謂殊方動慘悽送馮履道之西澗書院山長洛陽年少吳公薦絳灌當時老不如流涕痛哭出長䇿措世治安良有餘南臺御史書初下西澗先生席正虛爾祖郎官白首嘆諸孫卿相黑頭居餞鍾南山茂才北上南山蚤在十年見北闕今逢萬里遊紫府星辰迭差次黃塵日月漫淹留天子八萬一千歲玉京五城十二樓高臺黃金得駿馬錦衣白晝照間漚送亷公子北歸策勳際盛皇元世賜姓為亷舊相家江上行逢瑶圃樹天邊歸泛玊河槎黃封臘水人人酒白下春風處處花誰謂王孫慰離别踟蹰芳草獨興嗟次韻答惠長老棄為狂士幸相容敢向明時嘆不逢明月近人間傍水白雲邀客更登峰百年耳厭咸陽火千載神交劔浦龍車馬滿街門映燭夢魂初熟蔣陵鍾九月一日遊昭亭在宣州山色江光帶近郊道傍楊桞舞寒條半生九日黃花酒多在西風白下橋千里客遊仍暮景異鄉人事又今朝老來未遣登臨懶盡醉東家緑玉瓢寄謝子木秦贅誰徵夢午年漢官倉氏豈淹賢荒涼秋浦時時酒倣佛番江夜夜船湖海客身皆莫齒家山兒蕨已春拳何時與和歸來賦白沙謝住家黃沙丁住家未有田送王治書赴刑部尚書秋官高向霜臺選驛使逺從天府催周爵班行連九棘晉公勳業在三槐曉凝曳履星光動春逐持囊日影回自是咎繇先德讓四郊時報鳯凰來次韻介之雙檜亭作小圃新年偶然得靈禽清曉即同聽短髭故喜吾能白老眼今憐汝為青周官或自譽卿月漢史何人闕客星樓臺宰相曾無地貧賤諸生况有亭寄題道吾山聞襌師竹院道吾竹院芙蓉下老子藤床翡翠深過雨雷霆龍擁闥滿天風露鶴當林此君靜對了不厭諸老清談亦許尋他山祭酒聞還出何人載歌金玉音楊隱君竹所沙西處士萬修竹渭南封君千户侯滿院雨聲風入座擁階寒色日如秋江空每恐蛟龍化月出或看鸞鳯遊帶經先生已賓客其客兒原開徑取友更羊求五日書懷五月五日客不樂三十三年人未歸搔頭白髮千莖短出樹黃鸝一箇飛衰者秪應親緑醑故人不必問丹闈也知開士情緣重但道慈親消息稀送僧遊廬山十八社人五老邊香爐紫煙誰為然山光水影江行日風靜浪平船在天故里今逢霞外客孤蓬曾坐月中襌清吟一為浣塵土宛對三梁看瀑泉送笪子敬之蒼梧縣尹重瞳天子巡遊地黑髮郎官出宰時魚美也能如鄂渚鵬摶猶是息天池虞階干羽三苖國京洛笙簫二女祠滿縣東風花處處板輿雙奉但娛娭送圓侍者還平江承天寺承天寺裏圓侍者特地河邊别故人挂席風生海門樹換船日出揚子津西山負郭連青朵南浦行歌採白蘋好在玉堂柯博士老夫同郡髮如銀贈齊生侍大父僉憲海南為臨江浦折芙蓉更約郎君此地逢上水先經十二斗過山真是百千重留錢網户供朝膳挾策儒宫候曉鐘驄馬繡衣繩祖武最看蚤歲逺相從贈賢上人賢公江上五年别先帝宫前八月逢石榻護襌神役虎山堂聞法客為龍相擕久坐聊班草自愛能癯已稱松癡似廣陵張處士白頭也欲叩心宗題獨峰圖次虞閣老韻為高禪師作虛空樓閣開金布下界雲雷護寶藏萬仭側遮天半碧五更先見日初光床敷峻極羣龍繞音樂交加百鳥翔自是飛來五天竺靈根種種妙生香送僧還徑山天下徑山高在天兩到長憐弱冠年半嶺晴雲堆繭色上方朝雨雜龍涎生來底用無清業老去如今已白顛八十四翁安穩在阿師親證石頭禪黃氏拂雲堂臨川為家黃隱君種竹繞堂青拂雲長竿每許分漁者結實深期下鳯羣歲晚幽懷將雪對風來清語足秋聞寥寥千載吳夫子講道歸來遣贈文送周良臣赴湖州知事何顒青山碧苕上庾儉緑水紅蓮中風景與人殊自稱公餘擕客許誰同題詩醉歸帶夕鳥篆字小作蟠秋虹他時自是氷雪掾致身未愧水晶宫送公子帖穆入京龍沙公子五雲思鶯語皇州二月時苜蓿土融鞭節上蓬萊春近佩聲移承恩賜坐黃金褥獻壽親擎白玉巵馬上偶看鴻堆過簫中吹與鳯凰知曹文貞公挽辭九天日月臨中土四面星辰願上台漢祖功臣高甲第碭間佳氣久徘徊繡衣光彩東西道白簡威名內外臺聖代儀型勞夢想海雲清徹見蓬萊送人入京兼柬危太僕五月毒熱中人甚一雨生涼送客遊千載風雲逢聖代九天日月麗神州飛龍夢熟松聲夜倚馬吟生劔氣秋故人為報危徵士老客年來轉白頭送張管闕遷西臺東都早自去豺狼西去爭先覩鳳凰已報入關迎紫氣亦知詣闕覲清光周秦不謂殽函固吳楚遙連江漢長揚子津頭候驄馬老夫還足賦羔羊宜達樓天光徹夜看龍出海氣作秋如雨來水檻尋常羣客在洞庭七十二峰開慿將日月回雙轂攬取乾坤注一杯况是神仙好居此珊珊飛佩下蓬萊次韻用堂上人見懷續集短日還如昨日流老年可似壯年遊小輿樵徑山山晚落木人家處處秋夜黑丹光如月出天清溪響帶霜幽題詩乃復勞人憶置酒多因好客留送嶽彥臯湖北省親繡衣持節照青春綵服趨庭遡緑津門吏共迎鸚鵡近邦人爭看鳯雛新瞻烏渚屋沈吟久駐馬郊扉下問頻出入只教都不識每將民瘼細敷陳送南臺掾史劉孟琛陪治書順昌朝賀上帝南郊法駕親憲臣北道傳車新氷霜隨路關河曉雨露垂天海嶽春千里渥窪從驥子九重閶闔候雞人冕旒再拜山呼日玉帛交橫萬國賓送楊文舉赴江浙省宣使元年春及王正月半夜天回使者星五鳯文章能並世伯魚詩禮久趨庭雲邊宫闕時時到馬上河山處處經政德猶如太史令玉堂鬱鬱舊氊青送萬容長老歸故山長記題詩送萬容喜看飛錫下諸峰笙吹緱嶺仍騎鶴劔出豐城又化龍山氣含霜飄夕磬溪聲和月瀉寒舂何如官寺聽車馬空半黃塵起斷鐘用堂上人見過西園次韻張仲舉僦宅何緣得近僧曉光金氣接觚稜詩成未必如千偈老去還堪續一燈鹿苑即聞無上覺羊車自是最初乘北山且作相隨去幾個麒麟擁壞陵送僧歸番陽護龍客賦紫芝歌飯牛翁如白石何山頭桃熟不歸去秋深葉落忽已多舟行夾岸將青嶂風定滿湖皆白波記得康郎洲下住月明如海看漁蓑雲松隱者在梅山江上寄饒杜二君屬意老人輒用元韻兼謝所寄蒼耳酒老病無心搗鹿茸寄將蒼耳喜新濃清尊便酌當犧象大藥俄驚會虎龍野客好懷多感感故人嘉意每重重北來更愧諸侯禮酳饋循循擬辟雍送由上人遊金華兼柬信上人金華東日挂清曉玉樹西風吹晚秋王郎羊化青山石帝子龍飛白下洲二阮同居蕃佛寺雙溪獨坐闕人舟茶餘倘問西園檜翠色依然映白頭送季潭北遊兼柬張仲舉二首天上宫庭切玉繩霜前舟楫起金陵雲明鴻堆寒相迓風穩鯨魚晝不興丹罽導前參石佛黃襴從上賜江僧關山南國將歸日河水東風已解氷師尊已赴五天逺弟子寧辭萬里遙麟鳯效靈當盛世夔龍讓德列清朝歐陽外友交潛子華下封人祝聖堯好在玉堂張太史菲言應亦採芻蕘寄題金鵝泉石軒金鵝泉石有深趣黃鶴仙人曾獨來崖雨溜雲青玉㵼海天澄日碧蓮開山翁晏坐秋簾重野客倦逰溪棹回幽徑依然生藥草他年從此入天台題王元章梅三年不見王徵士一見梅花如見人風致山隂頻夢夜雪晴江上又逢春毫端只作尋常寫意度真同造化神聞道耶溪新買宅想栽千樹作比鄰送檜上人遊浙檜公作别雙檜下竺士去遊三竺間東州西州夜歌發南山北山春意間五湖月色客蕩楫九里松聲人掩關還向峰頭望天姥雲中古佛各開顔送馮侍御調燕南亷使繡衣高把使君節白晝寒生王母山三世為郎今特異百司聞命自銷姦官兵護送黃河道父老遮留白下關丹咮銜書仍北下紫薇執法更南還送僧之臨江白雲自愛青山好青春秪添白髮新檜能老翠堪留客栁恰初黃逺送人清江流日下到海閣皂插天無與鄰葛洪丹熟還勾漏可道年高鬢也銀次韻黃雲翼登雨華臺城郭江山秪舊時野園村巷總新詩衣冠昔日繁華地錦繡春風婀娜枝慷慨莫歌周室黍升平方報漢房芝願聞聖主賢臣頌最是王褒鬢未絲再用韻呈雲翼同生千載不逢時自出一家頻見詩月殿斧寒金粟樹河宫機爛錦花枝魏侯每過段干木杜老固知元紫芝欲引微詞常綴緝苦心抽盡不成絲題森碧軒卷鳯語雙調碧玉笙羽裳羣擁翠霓旌四時景物足蕭爽六月晝寒如太清丁令回歸應發興項斯標格况知名過門下馬豈無謂行酒賦詩殊有情送王雲翼之西臺分韻得西字方柏蕭森獨馬嘶故園迢遞早鶯啼九重湛露天方北一箇文星夜向西繡斧任賢交薦鶚衣裳候寢問鳴雞鯉魚自出舍旁井鳯鳥已銜門上泥陳先生挽辭西子湖邊眼獨青西州城下淚雙零先生致仕能強健太尉諸孫尚典刑江海未歸曾暮景東南長望且晨星真從處士徵霄霣久對郎君把墓銘奉酬李謹之見懷韻時豫客三茅讀書不逢萬乘君垂老願依千鶴羣澗底客身和月去雲中仙樂有時聞珠懸露樹明堪摘玉長霜田闕不耘道士若知人世事笑慿殿檻説朱雲送清涼寺友上人歸永嘉江心舊作野客宿石頭今逢開士歸半夜落潮隨棹發十年殘夢逐雲飛相逢接手話鄉里獨老忍淚沾裳衣新春亦有還家願會過石室推煙扉送麟天岸歸里河上先皇新作寺山中遊子獨思家孤藤得得千岩日廣袖翩翩五色霞耐可題詩留槲葉莫因採藥見桃花向來也怪諸尊宿長遣神蛇護木瓜寄題餘干西雲樓古洲琵琶江水濆藏山闌檻貯西雲歸霞偶作錦繡色落日或成鸞鵠文宿鶴夜飛天錯莫秋龍涼挂曉絪緼道人心境空無際謾道半間相與分次韻噩無夢楩用堂吳中倡和佳什二客當時共泊舟何人清夜獨垂鈎劉郎爵土方諸將嚴子生涯老一裘萬里關河空悵望百年江海儘嬉遊而今豈但忘機甚也得頭顱似白鷗寄題張伯壽煮石窩隱君不愛卞氏璞過客或酬雍伯漿色比天王黃竹賦食同仙子赤松方晝聲雨雜秋濤急夕氣煙凝曉露涼此日郡齋清味冷野居長是憶韋郎送張御史赴湖南僉憲祝融峰髙青入天洞庭水闊淨無煙使星夜度五千里老客夢長三十年一統乾坤分繡斧三苖風俗尚戈鋋埋輪舊日都門道會見徵還席屢前次韻具菴送湛淵上人永嘉省師早年為客曾遊處今日題詩却送僧珠箔濺崖看雪瀑寶窗緣塔見天燈金仙爛漫開銀界玉女嬋娟倚翠層禮罷阿師窮勝討諸峰歷歷漸攀登送答彥修御史調西臺泰華雲開仙掌明關門樹冷早霜清九天丹鳯銜書下六月青驄擁轡行南國江山吟總遍西州人士喜爭迎鷹鸇雕鶚高風外麟趾騶虞美化成覽勝樓二水三山帶逺洲五臺雙闕起高秋齊梁宫苑依城在江漢波濤入海流金剎曉開龍虎國玉笙宵下鳯凰丘一天灝氣清無際况及此時長倚樓挽欣笑隱親對先皇講法筵人間獨住十三年將同鳴鳯瑞下世恰道飛龍招上天長立寶階瞻寶樹亦知金像捧金蓮梵王此日生歡喜黑雨翻空浴九泉氷鬚次楊士輝韻倚馬寒過塞上城氣浮豐頰碎崢嶸高枝帶雪垂松翠斷縷含霜折藕莖蕭帝闕邊惟有白參軍幕下秪增清郎官未似馮唐老還就君王覔愛卿題飛龍亭昔聞飛龍登紫關龍飛上天竟不還上天下天皆帝所千古萬古空人間晴雲藹藹城頭樹春水迢迢江上山惟有神仙自騎鶴玉笙吹度月中間錢德謙父母同八十崑崙度索兩名仙已熟蟠桃幾歲年人世總誇同八十渠家秪道數三千錦機紫霧天孫織玉臼玄霜月姊傳恰是持將稱壽日秋風桂子集瓊筵奉柬浙東索士嵓僉憲二首天上星辰落世間少微婺女故相關覆盆光照家家屋持節春行處處山部屬頗聞時有旱父兄亦道食無艱大夫自是烏能好客老徒憐鶴未還少微婺女接高冥長立寒宵望使星支郡問民秋弭節泮宫延士曉談經雲深仙石羣羣白天外神山箇箇青不獨豺狼走荒絶亦聞蛟蜃落滄溟近仁臺郎見示樊左司在南臺時憶昨五首柯博士蘇徵君既為和之天台丁復僑居金陵草莽之臣也不能悉細奎章故事欽覩闕皇潛飛之盛猶能記之僣用元韻以寓鼎湖之思云爾猶記飛龍北上時從臣鞍馬雁差差鳯凰自是巢高閣螻蟻何因集下墀翠輦看花臨御苑彩毫摛藻綴文漪太平不願論封禪自擬元和聖德詩猶記金陵觀稼遊翠霄深處想瓊樓縱橫未草三千字縹眇如瞻十二旒秪爾丹心馳魏闕依然白髮老滄洲翠華不復南巡幸歲歲空來鴻堆秋猶記御牀金織幃初成寶剎倣丹墀人間漫道風雲會天上俄聞日月遲北闕秪今無賜物南臺憶昔有題詩舊臣總抱烏號泣豐石還如峴首碑猶記奎章擁紫薇五雲流彩日揚輝已頒玉果開春宴亦賜金蓮送夜歸俊逸詩篇臨鮑照風流人物動崔徽還憐杜牧秋娘賦色線寧堪補舜衣猶記華亭駕緑渠市人還許與歡虞後來盡備公車選前識皆知帝者圖相府帶圍從病沈酒家祠部屬狂俞鄰僧有髮惟須醉夜立霜畦望北樞題鴈圖為李元中賦萬里蒼茫南國秋黃蘆紫荻野蕭闕天涯兄弟將羣闕月闕樓臺動客愁肅肅夜寒霜滿羽駸駸年老闕頭闕目送江花發幾向東風憶故州送馬彥翬進士赴江西省管勾二首紅杏春風天上園看花走馬乍承恩紫薇曉日江南省擊水飛鵬早入垣鏡裏斷峯青兕伏船頭回浪白鯢奔二孤洲畔多明月恰過東溟苐一門行分幕府鳯凰池竊擬瑶階獬豸儀在職况當無事日讀書應似未官時客荒南國慚丹桂老灌西園長緑葵賢甚交承王博士滕王閣上酒歡持檜亭集卷八
