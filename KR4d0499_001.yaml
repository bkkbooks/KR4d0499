body:
  text: 檜亭集卷一元丁復撰古體四言有鳥前集有鳥有鳥鳴聲嘐嘐自東有居則西于巢有翩者翼載戢載翹害徃害否中心摇摇有鳥有鳥鳴聲孔悲生此東隅息彼西枝有翩者翼逝將奮飛我行遲遲莫知所依惟東有山嶺路其岐惟西有江湍流其支伊此之懷復彼之思莫知所之我心孔哀昔我來思狐裘披披今我何為絺綌有凄譬彼行驥有縶其馳言提其玦載泣㱆欷相彼鳴琴匪絃伊絲哀于途人宜莫我知聖或弗濟伊命也而命也如兹我行其隨衆羽送劉士幹知事赴湖廣省掾續集衆羽之差差彼翰而鴟衆趾之離離我獨于䕫夫乗而徃我徒于追波濤洶洶則匪于江彼陸康莊則舍而杭我聞瞶瞶我視于盲爾牽于驅愛􅎗其駒爾行徐徐於余焉居我有㫖酒聊樂與娛維山送章子端調浙東奏差維山其砠維水沮洳孰來吾蘇使君之車岨則有阪使車無反沮洳有衍伊澤斯逺維澤伊何孔碩洋洋我攸樂康使車彭彭惟驂在隅弗疾其驅彼華紆徐維章子之裾維山斯岵維水有滸章裾楚楚寔獲我所楚楚者衣肅肅者儀亦永其依我逸以敖娭原存為葉博士作道一而二闔闢周還孰職為之有極兹先繼善成性吾斯以立作息出入若主有室洞靈湛虚吾斯其居物備用周靡完弗初或窒于牖或狂弗守物物之糅斯曠斯有若隙之多其明晰晰由擴而充無逺弗暨如鏡之塵不遂于拭如泉之蒙不疏以力杲杲出日曀曀其隂何有何亡于劇用淫交萬吾前窮日有積廓然太清上下森植勿欺以慊曰誠其意心身家國正修齊治曷維其功吾欺有存戒慎恐懼于弗睹聞何幾之術載省于獨屋漏弗愧矧炤于伏恒焉存存曷出匪門性焉反焉孰為先民題墨蘭鳯凰可羅麒麟可羈我紉我佩我心傷悲檜亭集卷一
