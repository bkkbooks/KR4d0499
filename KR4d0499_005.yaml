body:
  text: 檜亭集卷五元丁復撰近體五言律詩送秦元之赴太禧同僉前集君家好兄弟聖主自知之周爵推秦仲虞官舉伯夷萬方天浩蕩五彩鳯威蕤宣室虛前席蒼生屬論思金陵送人還武昌相送白鷺洲因思黄鶴樓遥觀禹王蹟重起禰生愁西上不可得東闗曽獨留江吞趙佗石歲月但空流題程先生西行集後程年七十餘歸蜀改塟父母峽東水如箭巴行船上天亂離藁塟後衰老秭歸地名邊手把西行集心追北上年東風故山淚落日灑江烟大德丙午旱明年浙東饑僕因北上茲有感焉登髙分得疊嶂逺近不可數淡濃渾自成人烟諸崦隔鳥道半空横日夕黄微暎江寒碧倒生慿高共流眺憶得在宣城次韻宋太守薰烈避居湯水寺作贈其孫灝江上休為郡淮邊入戰場徑來悲棹短避去恐謀闕夾道松行直臨池蘚甃方蕭然忘執熱宴坐有清凉松髪凈于沐石牙寒作稜放行憂世者請浴下廊僧落日誰能繫浮雲不可慿佛前應墮淚不滅有長燈送李御史南臺鐵冠舊西府繡衣新史部氷霜曉皇家雨露春三苖蠻作俗八桂嶺為隣虞帝猶祠廟殷勤薦渚蘋萬玊亭修竹萬玊立虛亭六月寒靈風聽不足長日坐來殘葉色深冝闕鞭芽潔可盤故令憐老客轉欲厭時官送楊友直赴刑部主事少昊煩司幕先生自此升九重趨玉陛一騎發金陵邊靜龍堆月河清馬頰氷徒慙太平日江海老無能送郭經歴之淮西憲幙淝水緑逶迤淝山青陸離江天清共遠沙鳥白相宜百錬精金在孤忠聖主知幕蓮非乆地臺栢有高枝送王御史赴浙省都事白簡留烏府紅蓮映紫薇新春回桞色舊日避霜威海分諸州列江區萬室依硯氷題曉署辛苦解年饑寄劉安道號白雲巢遯世托巢處故鄉多白雲自期終不出相憶竟難分翠壑秋情逺青精曉饌芬何當謝茲去長是坐君闕送賈西伯西風苜蓿花南客又移家此道寧無用吾生未有涯峰青宜霧日潮白逆江沙猶憶南樓夜吹簫度歲華輓許覃峰號松雲失訪松雲隠哀吟薤露歌前朝諸老盡浮世百年過山水高情足詩書逺澤多何曾入城府秦鑿自寒波送張克讓秋花白露芹鄉郡萬山雲官冷難為滿囊空政喜聞灘船牽月上嶺路入閩分有客來書辟青霄記㕍羣送王伯庸赴石埭校官先生官已冷縣僻冷于官坐席嵐歸潤琴壇月過寒竒峰花作朶幽瀬玉為湍所喜無迎送高吟寄碧瀾賦孺子亭送心上人還洪東漢久無國南州猶有亭虛楹過日白老樹入湖青歲晚送僧去天寒行獨經搔頭雙檜側余髪故星星春雪江上亦春雪氣隨王化南平鋪方渾渾細落更毿毿桞棹渾無定花開恐不堪簷牙縣宿溜直擬老夫簪送李景初試吏淮陽便養讀書初試吏捧檄且娯親當代推經濟何人獨隠淪河兼淮海逺雪滿渚城春里舍多凋瘵周旋及撫循送客馬帳朋方集麟經講未殘幡然懐故里誰與障狂瀾黄卷秋檠短青氊夜榻寒好將池草句題與惠連看送盖御史士取登科貴官推御史賢已聞南紀正仍重北臺遷霜勁孤鷹起天高萬象懸遥知夜前席清問及遐偏對酒次韻諸公句如綺獨我鬂如絲平生雲霄志等閒霜雪髭遲日且云暮餘春能幾時還聽鳯凰語莫憶鷓鴣辭郭生生子歌愛誇頭玉憐應過掌珠河東真小鳯兾北定名駒英物湏啼看先生要醉扶老夫無重大折簡便堪呼題山莊晚霽圖為楊元清賦續集野居豈不好况是晚晴初草閣村村樹溪船箇箇漁闕松應宿鳥行李尚騎驢老託西園灌鄉愁頼酒除次韻曉發天未半殘兎水村千屋雞艣聲將夢逺溪語近人低岸口轉復出野心終不迷重衣起晨餉猶是衆山西送人省親子仕親亦喜子歸親更懽江湖片㠶逺風雨一氊寒沙鳥行秋渚江豚拜午湍莫看松桂色容易厭時官送翟彦敬陞中臺察院書吏名彦登烏府清門可雀羅辟書催北上行李及南訛天闊凉雲積江明暑雨過東門羣掾集更起續離歌檜亭集卷五
