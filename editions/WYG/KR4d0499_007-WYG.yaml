body:
  text: 檜亭集卷七元丁復撰近體七言長律送楊文質侍父之西臺御史乗驄西入闗郎君曉服擁斕斒東風桞色寒猶淺南國桃花春未殷後騎送官過白下前驅衛士負黄間州城獬豸峩冠度里社雞豚衣繡還問膳早朝河畔驛舉鞭遥識陜中山道途來徃爭加額父老邀迎各解顔渭水東流連二漢蜀都南去帯諸蠻秦中兵饉仍凋瘵劔外人風更阻艱勤讀古書探要𦕈與論時政及餘閒他年先後聽周魯送拜螭頭最上班送鎦堯甫之榆次縣尹南臺執法仰前人天禄然藜見後身從事衫明韶石曉叅軍䫇暎曲江春堯風自足敦殊俗舜樂時聞感至神瘴雨何能侵正士朶雲只著振疲民食塩增額終然去耕野愁眉自此伸遺愛郡山猶姓越歸看淮水未慙秦松㕔御史清霜曉榆次郎官列宿新後日乗驄湏北路新年泛鷁始南津舞斑取水辭慈閫衣繡還鄉照比隣撫字不妨催課拙平安即遣報書頻闕官起吏多為酷縣令于民實最親上國舄鳬行入覲中牟童雉㑹應馴故人總喜飛騰上老客仍甘寂寞濱臨别酌君浮蟻數相思何處早雞晨送僧希道迎母之宣州憲郎早是諸侯客宅相湏興内氏家徙舍曽聞習爼豆行臺今見重才華名門已道從張掖逸足端知産渥洼繡斧喜來初奉檄板輿迎去欲看花深氷自躍供江鯉常日仍思致海鮭禁臠羮辭璚面獸貢餘湯獻錦文𤓰怡聲即有平安報按部寧令造次差豸角剡霜書載續雀牙行路俗休譁固應反哺冝栖栢亦復承恩擬泛槎㑹著瑶池親賜宴玊桃三熟壽無涯壽龍翔長老訢笑隠𤣥雨高秋集九龍東天震旦主諸峰青蜺座踞黄金築紫鳯書銜白玉封賜到履鳴官寺鼓召歸兼聽御樓鐘雄文獨歩專三氏大法全提正五宗筵擁方來無數衆倉分隣住有餘春詩留杜甫頻茶椀社許陶潜更酒鍾凉夜熟眠貪夣蝶清朝枯思困吟蛩曇華世界慚吾晚桂子天香喜氣濃住世幾何論小刼陳詩再拜謝疎慵隨班作客應長席歸醉捉兒且小笻檜亭集卷七
