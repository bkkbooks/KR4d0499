body:
  text: 檜亭集卷四元丁復撰近體五言長律金陵奉餞趙公子去疾理問侍平章魯公世平入蜀歸秦次韻龍翔太中二十韻前集平章向三峽公子奉雙親祖帳聨裾盛官船發櫂新屋墩誰較謝宫井自餘陳劔閣當西極刀州逺北辰魯公加上爵趙氏洊名臣死節褒賢嗣生榮溢老身朝廷懐蹇蹇韋布佩諄諄及闕違後其闕接見頻渚風開鷁尾江日湧龍鱗夾㟁觀如堵中流望若神埋金陵樹逺濯錦水花勻前纛仍踰隴先墳宛在秦布颿知到日繡斧拜新春亦有羅貔虎無非聚鳯麟川將天作限山入海為濱從騎遥思棧安車緩度輪晨調珍翠釡夕侍妥文茵雛弄娯依坐雞鳴服伺隣所期長壽考莫或後嘉賓倘有星回使惟應日問人次夏允中禁體雪詩六十韻續集衾夜生孤擁樓更死屢撾墨雲常黯淡絲雨先鬖髿半醒身何所全迷意罔涯露眠當莽蒼風泊在兼葭闕起平行地訛聽亂撒沙羣憨摇始覺衆怪語闕幔卷爭成片裳沾秪見些尺深良可待寸測即頻闕熾炭肌還木張燈眼暈花闖明和月淡學舞逐風斜在臘時能應祈年歲必嘉競投牕外隙密糝砌旁窪尾亞攅鎗竹肪分破刃𤓰恍疑行朔幕只訝失胡笳賸有開甖貯渾無樹屏遮廊飄黏畫翠庖焮泣吹赮靜凝檐頭髓清垂瓦口牙廻溝填小曲側巷積㣲衺夕氣干牛斗酆城瘞鏌鎁暖融團腐草晴綴嵌空沙易化行人路偏多隠者家池心堅暮日山脊晃晨霞馬齒沈虛屐羊腸阻峻車荒藂喧餓雀垂蔓抱僵蛇縮頸牛如蝟拳毛馬盡騧自湏闕潔凈誰敢訾疵瑕公子添重錦夫人儗副珈聚闕簇雁作隊野屯鴉鬂縷搔驚似髯珠貫暫訝淵宫裁斷織閨服㡌初髽晉女吟稱謝唐人賦憶乂大田將有榖沃壤早宜麻乆睨隈墻色寧論在土芽舞娥臨月桂才士縱天葩朽壓傷頺架長支惜偃笆梅封新蓓蕾薪㸑濕杈枒京洛多豪富長安有狹邪掃開交擁篲戲聚互推爬帯沍張魚笱淩晨没兎罝卧來窮就捉跳出㨗從杈籺食何煎廹萍虀漫咄嗟跣趨哀䠥􅍷志肆咲矜夸數戰肩踰竦頻呵指更挼唇呼吟蟋蟀足趺伏蝦蟆懶出從嘲鼈甘貧任處蝸市舂窮也糴隣酤薄猶賖闕罍貳守何能爾明公特異哉蜚聲驚大府報最達重臺政洽邦千里心清水一杯威名動草木頌語出闕儒術行中道文光炳上台菁莪思樂育徴粟可遲迴飛檄如星急連檣駕浪來輪囷登廪庾精㓗粲珠闕炊㸑迷深竹摳趨失故苔馨香通肸蠁勲業此胚胎統宇𢎞無際顛厓政可哀箕疇先食貨商鼎頼塩梅峻陛高班入彤庭紫詔裁咨詢周逺迹答問徹闕盛德乾坤報危言山嶽摧田疇無失業府庫孰非財燮理隂陽事消沈水旱菑虞謨恒賛賛漢網願恢恢澤沛𢎞羊雨霾空野馬埃常令見白日終老北山隈檜亭集卷四
