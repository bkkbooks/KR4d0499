body:
  text: 檜亭集卷九元丁復撰近體七言絶句常熟道中阿郎問人常熟路北風打船寒日昏水樹含霜一個個野婦抱子自村村湖水如銀月欲低納糧船發五更雞當河小婦怨相闕璧乳兒寒自啼傅可用廬墓黃闕嶺頭曾置屋白頭江上不成家明月東去擕妻子掃食松隂十畝花題茅山彭道士畫梅花仙子緑燕棲寒夜不飛洞天霜淨月流輝夜深倣佛梅邊卧起摋青霞染素衣清溪與平起莘飲述舊有作溪頭楊栁女兒髮緑光細妥春油油金陵當日一樽酒何如相見在池州次韻李方叔逺樹葉初嵐色淡曲塘雨足水䀶肥何人春盡不飲酒野老年飢猶典衣次韻元宵雨雪銀燭春光玉雪霄翠簾歌館思寥寥羅浮洞裏花如織誰立寒香背小橋題江村小景野蓬忘世寒罾下沙筥牽兒早餉遲有客封侯玊門道緑閨春恨繞花枝題疊山卷江山老骨歸元亮今古何心兩伯夷半夜寒增霜院裏一編孤憤雪樓辭題春山曉行短棹衝煙釣碧沙疏鐘開曙散羣鴉早年曾是匡廬道下馬春崖問酒家夢遊仙春風捲席蒼鼇近夜月笙簫紫鳯鳴童女三千髮如黛碧桃花下笑相迎馬德昭席上賦江上重逄鄒大娘桃花紅嫩染纎裳蔓青溪上曾相見猶記胡麻飯顆香次韻江南斗酒十千即可賖斜窗短籬誰為遮大婦相迎問買酒十五小姑方主家東山斷雨拂青龍江飲倒垂千丈虹忽地北風狂作惡小波高湧白銀宫長干城南越王臺長干橋下客船來橋邊有人問書信羅裙小步踏青苔和山行兼次韻山鵲翅翻紅兩兩野花香並翠雙雙倦行有客春傷酒笑索無題晝倚窗因鎦思績過江寄闕誠之澤國無官寄老闕淮方有客借寒驢早知到死難干祿何用平生苦讀書次韻泐上人薝蔔花時風雨急苾芻叢裏脊令寒丹沙自古有方術白日今誰生羽翰白髮蕭騷日夜生玄雲消盡雪霜明新栽花木可憐長舊著衣裳不忍更賦蕙花次韻嶽上人香滿松房夜月虗紫㽔懸露泣方諸湘魂故惱維摩定起和離騷掃壁書題錢舜舉畫馬玉禾久飫出天間引看時常占舞班四十年來太平日屬車無數劔中山二十年前燕市客黃塵蔽天相逐來中有出頭先一丈山中倣佛憶龍媒題李遵道山水層峰高出雲樹外飛溜直下天河懸江南老客腸空斷舊宅不歸三十年題雪水茶卷子驛舍情孤蘭自花貂冠骨相袖中麻黨家婢子陶家妾學士方慚雪水茶偶題一事不能方近古六經何用更知新唐虞時世君臣會李杜文章宰相嗔酒間贈賈西白思入東風白雨邊莫雲春樹兩茫然不因絳灌輕新進未必長沙識少年題唐馬圖鳯膺龍脊渥窪姿正是奚官得意時野老步行身自穩詔書新下不教騎題子昻竹石圖為趙叔敬作大雅堂前第一峰亷纎小雨養新濃前年醉把湖州酒坐對蕭蕭日下舂題壁上山水老年歸思不堪行苦憶江城萬里程須寫緑醅三百盞恐添白髮數千莖題美人卷玉山橫管淚䀶光繡縟雙回綵鳯凰百巧心情題不得九疑雲冷隔三湘題李遵道仙客鯨魚沒海濤緑梢清夜月還高或傳騎去招丹鳯想見歸來掣六鼇絶句沙逺晴波淺漾金魚苖初上小如針將船載酒江頭飲水桞千株滿岸隂自愛江頭著雨蓑山光倒染鴨頭波蠻商即似天上下打鼓向人帆側過江蘺初長杜若新紫蕙紅蘭洲渚春楚天正逺欲有遺江上獨行逢故人桞下杯盤野老過闕緑波南浦傷心别黃犬東門奈爾何楊桞風輕欲午涼蘼蕪沙暖足春香水鄉父老茅堂酒不信王孫道路長北闕青雲車馬多南山白石飯牛歌霜清水屋釀春酒雨足野田收晚禾兩岸東風吹桞花小江新水帶春霞長林日出烏自乳買酒上船人到家茅屋雞聲接近鄰短裳巾幗莫歸頻江鄉禮俗淳風在煙樹深深數拜人熟麥收空雲斾斾新秧蒔遍雨沉沉誰嫌卑賤間無事老願太平渾有心贈唐德輝翠柏蕭森烏已啼白門涼月萬村雞山中獨識河東鳯五彩翩翩舞影齊題息齋竹為袁𢎞甫賦鳯凰西去不可還一竿清意自蕭間袁郎門外三尺雪却為晴光晝啓關題江鄉秋曉卷為李明逺賦滿地寒霜水氣昏亂鴉啼起向前村沙頭白鷺機還動未似熟眠深閉門贈武生六龍浴海吐長霞飛上遙空作火鴉十日相看當闕竹二更深雨坐燈花題汪伯高梅兔臼寒霜染雪毫緑煙微散月初高野人醉醒羅浮夢長憶仙娥玉色醪寒響蕭蕭已滿枝冷香不放小船移總宜酒散笙歌歇睡徹玉樓人未知贈劉子靜括蒼山色翠如蔥瀑下天門拖玉虹底事少微星一點金陵江上愛西風過溧陽錢氏祖墓汾陽軍中淚如㵼長陵一壞寧有孫千章喬木高闕起倚柱凍雲斷客魂次韻西湖竹枝詞上塘楊桞下塘隂阿郎愛人不愛金塘水西流東入海水深不似阿儂深柳葉如眉枝似腰贈郎輒挽最長條條長即與儂心逺不是為儂春態嬌錢唐潮來兩岸平錢唐潮去江月明錢塘女子新樓閣夜半吹簫鸞鳯鳴郎愛捕魚儂織蓑勸郎不必要登科一家賣魚得食少一官懸魚憂患多題楚江清曉圖海色澄明霞欲生白煙樓閣靜崢嶸青楓江上船已發苦竹嶺頭人未行題山水為劉子益賦古寺煙雲置碧岩獨僧隨徑入松杉故鄉忽動金陵客便欲海門歸挂帆贈李明逺金陵龍眠見三李震伯晉仲子才兄弟三人齊名瓊林鵷雛哦二松子才登己巳進士第為番陽縣丞名駒墮地亦千里騰鳯沖霄須九重送渭清逺上人謁虞學士求墓志白玉似人蒲室老黃金如價草堂文筆濡華蓋山前月光動石頭城上雲九重閶闔向來人五色芙蓉已後身一代文章來絶世千年道德在堅珉水鳥羣隨南上篷江豚自拜北來風二姑直作片時過五老秪如前日同平生太史未相親秪托新詩附逺人自是星虛接牛斗誰教天漢隔參辰山中氣候冬春近江上帆檣早晚回曽草詞章扶日馭肯將文字説天台題柯敬仲竹木青山白日野中看南國佳人翠袖寒老樹不堪承雨露龍孫春滿錦闌千題危太朴雲林圖六言天台萬八千丈雲林三十六峯幾載山中獨憶今朝江上相逢檜亭集卷九
