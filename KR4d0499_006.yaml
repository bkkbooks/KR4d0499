body:
  text: 檜亭集卷六元丁復撰近體五言絶句題李息齊枯木竹圖霜柯洞庭寒露葉渭川冷幽人美清夜獨寫秋燈影題牧牛圖邈爾三尺童御此兩觳觫春風笠底回前村燒㾗緑與韓成之飲分韻得多字壯髮颯衰素故山鬱嵯峨鄉書千里發客淚一時多送單道明常州迎婦單郎晉陵去絶似向秦臺後夜簫聲發雙騎彩鳯來題宣和畫卷淡意芙蓉外閒情翡翠邊波翻太液水分送向南船送僧還洪帆開建業水人上豫章臺許令蛟腥起滕王雨色來飲酒北闕諸公貴東門幾客還瞥來缸面酒擕坐屋頭山贈孟通孟通朔方彥領薦過升州花發瓊林苑題詩向上頭題畫青山多白雲佳樹雜芳植伊人不可招關路日已夕送吳景賢赴廣東二首秋浦同為客金陵祗得君天風復戲我吹作嶺南雲隱之千載後共喜逺孫來為酌亷泉水殷勤寄鳯臺紅白千葉梅作白歲已晚能紅春未深天地固闕黃蜀葵憔悴宫人額離披道士身舉頭長見日草莽老為臣桃花春色總可惜最憐紅未開留花能解事郎去待歸來題花宿鴈圖二首修程倦霄漢清夢熟江湖夜久水烟寂月明關塞孤江漢月中白氷霜天上寒扁舟夜深夢猶自上長安賦山上松送常上人松生在山上垂柯䕃其下人生苦别離念此歲寒者題周濟川墨竹東窗亦既白疏竹淡搖影新梢未成實夜高飢鳯醒題黃晉卿寄用堂枯木竹圖用堂嘗寄蘭與黃公公時喪母太史悲萱樹幽人贈佩蘭故揮風木淚持答翠琅玕檜亭集卷六
