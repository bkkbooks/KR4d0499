body:
  text: 檜亭集卷六元丁復撰近體五言絶句題李息齋枯木竹圖霜柯洞庭寒露葉渭川冷幽人羙清夜獨寫秋燈影題牧牛圖邈爾三尺童御此兩觳觫春風笠底回前村燒㾗緑與韓成之飲分韻得多字壯髪颯衰素故山鬱嵯峨鄉書千里發客淚一時多送單道明常州迎婦單郎晉陵去絶似向秦臺後夜簫聲發雙騎彩鳯來題宣和畫卷澹意芙蓉外閒情翡翠邊波翻太液水分送向南船送僧還洪颿開建業水人上豫章臺許令蛟腥起滕王雨色來飲酒北闕諸公貴東門幾客還瞥來缸面酒擕坐屋頭山贈孟通孟通朔方彦領薦過昇州花發瓊林苑題詩向上頭題畵青山多白雲佳樹雜芳植伊人不可招闗路日已夕送呉景賢赴廣東二首秋浦同為客金陵祗得君天風復戯我吹作嶺南雲隠之千載後共喜逺孫來為酌亷泉水殷勤寄鳯臺紅白千葉梅作白歲已晚能紅春未深天地固闕黄蜀葵憔悴宫人額離披道士身舉頭長見日草莽老為臣桃花春色總可惜最憐紅未開留花能解事郎去待歸來題花宿鴈圖二首修程倦霄漢清夢熟江湖夜乆水烟寂月明闗塞孤江漢月中白氷霜天上寒扁舟夜深夢猶自上長安賦山上松送常上人松生在山上垂柯䕃其下人生苦别離念此歲寒者題周濟川墨竹東窻亦既白疎竹淡摇影新梢未成實夜高飢鳯醒題黄晉卿寄用堂枯木竹圖用堂嘗寄蘭與黄公公時喪母太史悲蘐樹幽人贈佩蘭故揮風木淚持答翠琅玕檜亭集卷六
